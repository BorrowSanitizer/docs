name: docs-preview

# Runs on PRs only
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    env:
      MDBOOK_VERSION: 0.4.36
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update
          cargo install --version ${MDBOOK_VERSION} mdbook
          cargo install mdbook-image-size mdbook-external-links
      - name: Update latest redirect
        run: |
          LATEST=$(ls src/status/ | python3 -c "
          import sys, datetime
          entries = sys.stdin.read().split()
          def to_date(s):
              name = s.removesuffix('.md')
              month, year = name.split('_')
              return datetime.datetime.strptime(f'{month} {year}', '%B %Y')
          print(sorted(entries, key=to_date)[-1].removesuffix('.md'))
          ")
          sed -i '' 's|"/latest.html" = ".*"|"/latest.html" = "/status/'"$LATEST"'.html"|' book.toml
      - name: Build with mdBook
        run: mdbook build