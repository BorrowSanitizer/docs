name: docs

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: macos-latest
    env:
      MDBOOK_VERSION: 0.4.36
    steps:
      - uses: actions/checkout@v4
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update
          cargo install --version ${MDBOOK_VERSION} mdbook
          cargo install mdbook-image-size mdbook-external-links
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Update latest redirect
        run: |
          LATEST=$(ls src/status/ | python3 -c "
          import sys, datetime
          entries = sys.stdin.read().split()
          def to_date(s):
              name = s.removesuffix('.md')
              month, year = name.split('_')
              return datetime.datetime.strptime(f'{month} {year}', '%B %Y')
          print(sorted(entries, key=to_date)[-1].removesuffix('.md'))
          ")
          sed -i '' 's|"/latest.html" = ".*"|"/latest.html" = "/status/'"$LATEST"'.html"|' book.toml
      - name: Build with mdBook
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
